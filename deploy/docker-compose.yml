# 900 万文件阶段一：单机 1×RTX A6000 编排。变量全部来自同目录的 .env（从 .env.example 复制）。
#
# 常驻：postgres、api、cpu-worker（波次 0 + 归档）
# GPU 波次（同一时间只开一个，ops.sh 负责切换；就算误开两个，也会在 /data/locks/gpu_0.lock 上排队）：
#   --profile ocr       ocr-worker       波次 1，PaddleOCR
#   --profile classify  classify-worker  波次 2，bge-m3 + reranker
#   --profile monitoring prometheus、dcgm-exporter
#
# 源目录、归档根按宿主机原路径挂进容器，台账里记的路径在宿主机上可以直接打开。
name: pdfcls

x-db-url: &db_url postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

x-worker: &worker
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  restart: unless-stopped
  stop_grace_period: 90s
  healthcheck:
    disable: true
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options: {max-size: 200m, max-file: "5"}

x-worker-env: &worker_env
  DATABASE_URL: *db_url
  SOURCE_ROOTS: ${SOURCE_ROOT:?}
  ARCHIVE_ROOT: ${ARCHIVE_ROOT:?}
  LOCK_DIR: /data/locks
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-gpu: &gpu
  devices:
    - driver: nvidia
      device_ids: ["${GPU_DEVICE:-0}"]
      capabilities: [gpu]

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-12GB}
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - autovacuum_vacuum_scale_factor=0.02
      - -c
      - autovacuum_analyze_scale_factor=0.01
    shm_size: 1g
    volumes:
      - ${PG_DATA_DIR:?}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 100m, max-file: "5"}

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args: {PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"}
    image: pdfcls-api:${IMAGE_TAG:-latest}
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      DATABASE_URL: *db_url
      API_KEY: ${API_KEY:?}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${DATA_DIR:?}/exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 100m, max-file: "5"}

  cpu-worker:
    <<: *worker
    image: pdfcls-api:${IMAGE_TAG:-latest}
    command: ["python", "-m", "phase1", "work", "--stage", "cpu", "--stage", "archive",
              "--procs", "${CPU_PROCS:-16}"]
    environment:
      <<: *worker_env
    volumes:
      - ${SOURCE_ROOT:?}:${SOURCE_ROOT:?}:ro
      - ${ARCHIVE_ROOT:?}:${ARCHIVE_ROOT:?}
      - ${DATA_DIR:?}/locks:/data/locks
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  ocr-worker:
    <<: *worker
    profiles: ["ocr"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ocr
      args: {PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"}
    image: pdfcls-ocr:${IMAGE_TAG:-latest}
    command: ["python", "-m", "phase1", "work", "--stage", "ocr", "--procs", "${OCR_PROCS:-3}"]
    environment:
      <<: *worker_env
      OCR_USE_GPU: "1"
      OCR_DPI: ${OCR_DPI:-200}
      FLAGS_allocator_strategy: auto_growth
    volumes:
      - ${SOURCE_ROOT:?}:${SOURCE_ROOT:?}:ro
      - ${DATA_DIR:?}/locks:/data/locks
      - ${MODEL_DIR:?}/paddleocr:/home/app/.paddleocr
    shm_size: 4g
    deploy:
      resources:
        reservations: *gpu

  classify-worker:
    <<: *worker
    profiles: ["classify"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.infer
      args: {PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"}
    image: pdfcls-infer:${IMAGE_TAG:-latest}
    command: ["python", "-m", "phase1", "work", "--stage", "classify", "--procs", "${CLASSIFY_PROCS:-1}"]
    environment:
      <<: *worker_env
      # 分类只读台账里的证据文字，不挂源目录，也就不检查它
      SOURCE_ROOTS: ""
      MODEL_DEVICE: cuda
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      THRESHOLDS_FILE: ${THRESHOLDS_FILE:-}
      # LLM_ENDPOINT 留空就用下面的本地 llm 服务；LLM_MODEL 留空或 LLM_MAX_CALLS=0 表示不用大模型
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://llm:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-32}
    volumes:
      - ${DATA_DIR:?}/locks:/data/locks
      - ${DATA_DIR:?}/config:/config:ro
      - ${MODEL_DIR:?}/hf:/models/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 4g
    deploy:
      resources:
        reservations: *gpu

  # 可选的大模型兜底：向量 + 重排拿不准时，让大模型在候选里选一个或回答拿不准。
  # 只在分类波次期间运行（ops.sh wave classify 先起它、等就绪再起 classify-worker），OCR 波次时停掉让出显存。
  llm:
    profiles: ["llm"]
    image: vllm/vllm-openai:${VLLM_TAG:-v0.6.6.post1}
    command:
      - --model
      - ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --served-model-name
      - ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --gpu-memory-utilization
      - "${LLM_GPU_UTIL:-0.40}"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "16"
      - --disable-log-requests
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ${MODEL_DIR:?}/hf:/root/.cache/huggingface
    ipc: host
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 900s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 100m, max-file: "3"}
    deploy:
      resources:
        reservations: *gpu

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROM_PORT:-9090}:9090"
    restart: unless-stopped

  dcgm-exporter:
    profiles: ["monitoring"]
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.7-3.5.0-ubuntu22.04
    cap_add: [SYS_ADMIN]
    ports:
      - "127.0.0.1:9400:9400"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  promdata:
